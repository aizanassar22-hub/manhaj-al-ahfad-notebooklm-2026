const panel=document.getElementById('lesson'),prog=document.getElementById('prog');
let stage='start',seq=0,spoken='',answerLocked=false;
const stages=['start','goals','learn','picture','organ','behaviors','sara','ahmad','practices','family','end'];
const B=[['أبتعد عن دخان السيارات.',true],['أفتح النوافذ لتهوية الصف.',true],['أمارس رياضة المشي صباحًا.',true],['أجلس بالقرب من المدخنين.',false]];
const readText={learn:'يجب الابتعاد عن الدخان والتلوث للمحافظة على صحة الجهاز التنفسي. أكثر عضو يتضرر من التدخين هو الرئة. أغذية الوقاية تحمي أجسامنا من الأمراض.',picture:'الرئة هي أكثر عضو يتضرر من التدخين.'};
const b=(text,fn,cls='')=>`<button class="btn ${cls}" type="button" data-action="${fn}">${text}</button>`;
function speakStop(){if('speechSynthesis' in window) window.speechSynthesis.cancel(); spoken='';}
function nav(s){speakStop();stage=s;answerLocked=false;render();scrollTo(0,0);}
function speech(action){if(!('speechSynthesis' in window)){document.getElementById('status').textContent='القراءة الآلية غير متاحة في هذا المتصفح.';return;}
 let synth=window.speechSynthesis;
 if(action==='pause'){synth.pause();document.getElementById('status').textContent='تم إيقاف القراءة مؤقتًا';return;}
 if(action==='resume'&&synth.paused){synth.resume();document.getElementById('status').textContent='استؤنفت القراءة';return;}
 synth.cancel();let u=new SpeechSynthesisUtterance(readText[stage]||'');u.lang='ar-PS';u.rate=.88;u.pitch=1.02;
 const voices=synth.getVoices();const v=voices.find(v=>v.lang.toLowerCase().startsWith('ar-ps'))||voices.find(v=>v.lang.toLowerCase().startsWith('ar'));
 if(v)u.voice=v;u.onend=()=>{document.getElementById('status').textContent='اكتملت القراءة'};u.onerror=()=>{document.getElementById('status').textContent='تعذر تشغيل القراءة على هذا الجهاز'};
 synth.speak(u);document.getElementById('status').textContent='تجري قراءة النص بصوت الجهاز';
}
function reader(){return `<div class="spoken"><div class="speaker-controls">${b('▶ استمع للشرح','read','secondary')}${b('⏸ إيقاف مؤقت','pause','ghost')}${b('▶ متابعة','resume','ghost')}${b('↻ إعادة','read','ghost')}</div><span id="status">الصوت قراءة آلية من الجهاز، وقد تختلف اللهجة ونوع الصوت. تسجيل المعلمة الفلسطينية لم يُرفق بالـ PDF.</span></div>`}
function render(){const i=stages.indexOf(stage);prog.style.width=(Math.max(0,i)/(stages.length-1)*100)+'%';let h='';
if(stage==='start')h=`<div class="hero"><div><h1>كيف نحافظ على صحة جهازنا التنفسي؟</h1><p class="lead">نتعلّم السلوك الصحيح، ثم نختار ونجرب بأنفسنا.</p>${b('ابدأ الدرس ←','goals')}</div><img src="${IMG.lungs}" alt="مقارنة من بطاقة الدرس بين رئتين قبل التدخين وبعده"></div><div class="note">هذا الدرس يستند حصريًا إلى بطاقة «صحة الجهاز التنفسي» للصف الرابع.</div>`;
else if(stage==='goals')h=`<h2>هدف الدرس</h2><p class="muted">بعد التعلم، أستطيع أن:</p><div class="cards"><div class="fact">أميّز السلوك الصحيح والخاطئ للمحافظة على الجهاز التنفسي.</div><div class="fact">أحدّد العضو الأكثر تضررًا من التدخين.</div><div class="fact">أذكر سلوكيات تساعدني على المحافظة على صحة الجهاز التنفسي.</div></div><div class="row">${b('هيا نتعلّم ←','learn')}</div>`;
else if(stage==='learn')h=`<h2>كيف أحمي جهازي التنفسي؟</h2><div class="cards"><div class="fact">أبتعد عن الدخان والتلوث.</div><div class="fact">الرئة هي أكثر عضو يتضرر من التدخين.</div><div class="fact">أغذية الوقاية تحمي أجسامنا من الأمراض.</div></div>${reader()}<div class="row">${b('أشاهد صورة الدرس ←','picture')}</div>`;
else if(stage==='picture')h=`<h2>الرئة والتدخين</h2><div class="split"><div class="imgframe"><img src="${IMG.lungs}" alt="صورة من بطاقة الدرس تقارن رئة غير مدخن برئة مدخن"></div><div><div class="question">أكثر عضو يتضرر من التدخين هو الرئة.</div>${reader()}${b('أختبر فهمي ←','organ')}</div></div>`;
else if(stage==='organ')h=`<h2>نشاط (١): أختار الإجابة</h2><div class="question">ما العضو الأكثر تضررًا من التدخين؟</div><div class="grid">${['البلعوم','الحنجرة','الرئة','الأنف'].map((a,i)=>b(a,'organ_'+i,'option')).join('')}</div><div id="feedback"></div><div class="row">${b('أعود إلى الشرح','picture','ghost')}</div>`;
else if(stage==='behaviors')h=`<h2>نشاط (٢): سلوك صحيح أم خاطئ؟</h2><p class="muted">الموقف <strong>${seq+1}</strong> من ٤</p><div class="question">${B[seq][0]}</div><div class="grid">${b('✓ صحيح','behavior_1','option')}${b('✕ خاطئ','behavior_0','option')}</div><div id="feedback"></div>${b('أبدأ من أول موقف','reset','ghost')}`;
else if(stage==='sara')h=`<h2>نشاط (٣): ماذا تفعل سارة؟</h2><div class="split"><div class="imgframe"><img src="${IMG.sara}" alt="سارة مع صور السيارات والمصانع ومصادر الدخان، كما في الكتاب"></div><div><div class="question">هل وقوف سارة قرب دخان السيارات والمصانع سلوك صحيح؟</div><div class="grid">${b('نعم، صحيح','sara_1','option')}${b('لا، خاطئ','sara_0','option')}</div><div id="feedback"></div></div></div>`;
else if(stage==='ahmad')h=`<h2>أنظر وأفكّر: سلوك أحمد</h2><div class="split"><div class="imgframe"><img src="${IMG.ahmad}" alt="رسم لأحمد يعاني من السعال في بطاقة الدرس"></div><div><div class="question">ما رأيك في سلوك أحمد؟ ولماذا؟</div><p>فكّر قليلًا، ويمكنك كتابة رأيك أو مناقشته مع معلمتك أو أسرتك.</p><textarea aria-label="أكتب رأيي في سلوك أحمد" placeholder="أكتب رأيي هنا إن أردت..."></textarea><div class="row">${b('أواصل ←','practices')}</div></div></div>`;
else if(stage==='practices')h=`<h2>أختار أربع ممارسات صحية</h2><p>ضع علامة أمام الممارسات الصحيحة الواردة في بطاقة الدرس:</p><div class="card-list" id="checks">${[['الابتعاد عن دخان السيارات',true],['فتح النوافذ لتهوية الصف',true],['ممارسة رياضة المشي صباحًا',true],['الجلوس بالقرب من المدخنين',false],['الابتعاد عن المدخنين',true]].map((x,i)=>`<label class="checkline"><input type="checkbox" value="${i}"><span>${x[0]}</span></label>`).join('')}</div><div class="row">${b('أتحقق من اختياراتي','verify')}</div><div id="feedback"></div>`;
else if(stage==='family')h=`<h2>نشاط تفوق: أبحث مع أسرتي</h2><div class="question">بمساعدة أحد أفراد أسرتك، وضّح العلاقة التكاملية بين الجهاز التنفسي والجهاز الهضمي.</div><p>هذا السؤال مفتوح للتفكير والمناقشة كما ورد في بطاقة الدرس. لا تظهر له إجابة جاهزة من خارج المصدر.</p><textarea aria-label="مساحة لكتابة إجابة نشاط التفوق" placeholder="أكتب أفكاري بعد المناقشة..."></textarea><div class="row">${b('أنهي الدرس ←','end')}</div>`;
else if(stage==='end')h=`<h1>أحسنت! أنهيت الدرس 🎉</h1><div class="fact" style="background:var(--mint)">أستطيع التمييز بين السلوكيات الصحيحة والخاطئة للمحافظة على صحة جهازي التنفسي.</div><div class="row">${b('أعيد الدرس','start','secondary')}${b('أعيد الأنشطة','organ')}</div>`;
panel.innerHTML=h;panel.focus({preventScroll:true});}
function fb(txt,ok,next){const el=document.getElementById('feedback');if(!el)return;el.innerHTML=`<div class="feedback ${ok?'yes':'no'}" role="status">${txt}</div><div class="row">${next?b('أواصل ←',next):b('أعيد المحاولة','again','ghost')}</div>`}
document.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const act=btn.dataset.action;
if(stages.includes(act)){nav(act);return}
if(act==='read'||act==='pause'||act==='resume'){speech(act);return;}
if(act==='again'){answerLocked=false;document.querySelectorAll('.option').forEach(x=>x.disabled=false);document.getElementById('feedback').innerHTML='';return;}
if(act==='reset'){seq=0;nav('behaviors');return;}
if(act.startsWith('organ_')){if(answerLocked)return;answerLocked=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(act==='organ_2')fb('أحسنت! الرئة هي أكثر عضو يتضرر من التدخين.',true,'behaviors');else fb('تلميح: تأمّل صورة الرئتين، ثم حاول من جديد.',false);return;}
if(act.startsWith('behavior_')){if(answerLocked)return;answerLocked=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);let val=act==='behavior_1',correct=B[seq][1]; if(val===correct)fb('أحسنت! هذا الاختيار صحيح.',true,'behavior_next');else fb('فكّر مجددًا: هل يساعد هذا السلوك على المحافظة على الجهاز التنفسي؟',false);return;}
if(act==='behavior_next'){seq++;nav(seq>=B.length?'sara':'behaviors');return;}
if(act.startsWith('sara_')){if(answerLocked)return;answerLocked=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(act==='sara_0')fb('صحيح! الهواء ملوّث بدخان السيارات والمصانع.',true,'ahmad');else fb('تلميح: علينا الابتعاد عن الدخان والتلوث.',false);return;}
if(act==='verify'){const chosen=[...document.querySelectorAll('#checks input:checked')].map(x=>+x.value).sort().join(',');fb(chosen==='0,1,2,4'?'أحسنت! اخترت الممارسات الأربع الصحيحة.':'راجع اختياراتك؛ هناك أربع ممارسات صحيحة، وتجنّب الجلوس قرب المدخنين.',chosen==='0,1,2,4',chosen==='0,1,2,4'?'family':null);return;}
});
// Listen only on actual user-triggered controls, never on arbitrary body clicks.
window.addEventListener('pagehide',speakStop);
render();
</script></body></html>
